name: CI
on:
  push:
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:web
      - run: pip install pytest && python -m pytest -q
      - run: npm audit --omit=dev --audit-level=high
  e2e:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  # The real add-on code against a real local Worker. Catches changes that would break add-ons already installed on people's computers.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: npm ci
      - run: pip install pytest
      - name: Run the add-on against a local Worker
        run: |
          npm run e2e:server > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8787/ > /dev/null && break; sleep 2; done
          LEADERBOARD_URL=http://localhost:8787 python -m pytest tests/addon/test_contract.py -q

  # Deploys only after every check passes, and only for pushes to main. Pull requests never see these secrets.
  deploy:
    needs: [test, e2e, contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
